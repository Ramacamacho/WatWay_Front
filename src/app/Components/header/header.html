<header class="header">
  <nav class="mae">
    <p class="logo"  routerLink="/"><img src="watwaylogo.png" alt="logow"></p>
    <p class="link" routerLink="/sobrenosotros">Sobre nosotros</p>

    @if (estaLogueado()) {
      <p class="link" routerLink="/checklist">Checklist</p>
      <p class="link" routerLink="/match">Match</p>
      <p class="btn btn-gold" (click)="cerrarSesion()">Cerrar sesión</p>
      <p class="link" routerLink="/perfil">Mi Perfil</p>
    } @else {
      <p class="btn btn-gold" routerLink="/login">Iniciar sesión</p>
      <p class="btn btn-gold" routerLink="/crearcuenta">Crear cuenta</p>
    }
  </nav>
</header>
