<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 525" width="565" height="525" role="img" aria-label="Avión sobre libreta de gastos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .avion   { animation: volar 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sombra  { animation: sombra 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .estela  { animation: estela 1.4s linear infinite; }
    @keyframes volar {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50%      { transform: translate(10px, -16px) rotate(-1.8deg); }
    }
    @keyframes sombra {
      0%, 100% { transform: scale(1);    opacity: .22; }
      50%      { transform: scale(.88);  opacity: .1; }
    }
    @keyframes estela { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .avion, .sombra, .estela { animation: none; }
    }
  </style>
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- sombra de la libreta -->
  <ellipse cx="300" cy="500" rx="230" ry="22" fill="#14213D" opacity=".15" filter="url(#blur)"/>

  <!-- LIBRETA -->
  <g>
    <!-- espesor -->
    <polygon points="22,272 205,470 478,378 478,408 205,500 22,302" fill="#1B2A52"/>
    <polygon points="205,470 478,378 478,408 205,500" fill="#233763"/>
    <!-- hoja (plano en perspectiva) -->
    <g transform="matrix(0.91 -0.307 0.61 0.66 22 272)">
      <rect width="300" height="300" fill="#F8F4E8" stroke="#14213D" stroke-width="1.5"/>
      <g stroke="#D9D2BE" stroke-width="1">
        <line x1="0" y1="50"  x2="300" y2="50"/>
        <line x1="0" y1="78"  x2="300" y2="78"/>
        <line x1="0" y1="106" x2="300" y2="106"/>
        <line x1="0" y1="134" x2="300" y2="134"/>
        <line x1="0" y1="162" x2="300" y2="162"/>
        <line x1="0" y1="190" x2="300" y2="190"/>
        <line x1="0" y1="218" x2="300" y2="218"/>
        <line x1="0" y1="246" x2="300" y2="246"/>
        <line x1="0" y1="274" x2="300" y2="274"/>
      </g>
      <line x1="62" y1="0" x2="62" y2="300" stroke="#D99A8F" stroke-width="2"/>
      <text x="78" y="40" font-family="'Big Shoulders Display','Bebas Neue',Impact,sans-serif" font-weight="800" font-size="26" fill="#14213D">Gastos</text>
      <g font-family="'IBM Plex Mono','Courier New',monospace" font-size="12" fill="#14213D">
        <text x="78" y="72">Alojamiento</text><text x="270" y="72" text-anchor="end">900</text>
        <text x="78" y="100">Súper</text><text x="270" y="100" text-anchor="end">86</text>
        <text x="78" y="128">Transporte</text><text x="270" y="128" text-anchor="end">42</text>
        <line x1="78" y1="140" x2="270" y2="140" stroke="#14213D" stroke-width="2"/>
        <text x="78" y="162" font-weight="700">Total US$</text><text x="270" y="162" text-anchor="end" font-weight="700">1028</text>
      </g>
    </g>
    <!-- anillas -->
    <g fill="#B08D3C" stroke="#14213D" stroke-width="2">
      <circle cx="52"  cy="278" r="8"/><circle cx="68"  cy="294" r="8"/><circle cx="82"  cy="311" r="8"/>
      <circle cx="96"  cy="327" r="8"/><circle cx="110" cy="343" r="8"/><circle cx="127" cy="360" r="8"/>
      <circle cx="141" cy="376" r="8"/><circle cx="159" cy="394" r="8"/><circle cx="177" cy="413" r="8"/>
      <circle cx="195" cy="433" r="8"/><circle cx="213" cy="454" r="8"/>
    </g>
    <g fill="#14213D">
      <circle cx="52" cy="278" r="3.5"/><circle cx="68" cy="294" r="3.5"/><circle cx="82" cy="311" r="3.5"/>
      <circle cx="96" cy="327" r="3.5"/><circle cx="110" cy="343" r="3.5"/><circle cx="127" cy="360" r="3.5"/>
      <circle cx="141" cy="376" r="3.5"/><circle cx="159" cy="394" r="3.5"/><circle cx="177" cy="413" r="3.5"/>
      <circle cx="195" cy="433" r="3.5"/><circle cx="213" cy="454" r="3.5"/>
    </g>
  </g>

  <!-- sombra del avión sobre la hoja -->
  <ellipse class="sombra" cx="300" cy="335" rx="95" ry="20" fill="#14213D" opacity=".18" filter="url(#blur)"/>

  <!-- estela punteada -->
  <path class="estela" d="M 92 202 C 84 232, 70 256, 24 270" fill="none" stroke="#B08D3C" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 8"/>

  <!-- AVIÓN -->
  <g class="avion" stroke="#14213D" stroke-width="3" stroke-linejoin="round">
    <!-- ala lejana -->
    <polygon points="405,15 450,18 378,110 315,110" fill="#1F2F55"/>
    <!-- deriva -->
    <polygon points="88,78 128,80 182,150 104,160" fill="#14213D"/>
    <polygon points="95,98 125,100 127,120 97,118" fill="#B08D3C" stroke="none"/>
    <!-- estabilizador -->
    <polygon points="100,226 190,194 178,224 128,230" fill="#14213D"/>
    <!-- fuselaje -->
    <g transform="rotate(-9.3 305 142)">
      <rect x="70" y="119" width="470" height="46" rx="23" fill="#EADFC6"/>
      <rect x="95" y="149" width="410" height="6" rx="3" fill="#B08D3C" stroke="none"/>
      <rect x="482" y="124" width="48" height="15" rx="7" fill="#14213D" stroke="none"/>
      <g fill="#14213D" stroke="none">
        <circle cx="190" cy="137" r="5"/><circle cx="235" cy="137" r="5"/><circle cx="280" cy="137" r="5"/>
        <circle cx="325" cy="137" r="5"/><circle cx="370" cy="137" r="5"/>
      </g>
    </g>
    <!-- ala cercana -->
    <polygon points="372,142 255,190 160,290 268,258" fill="#14213D"/>
    <polygon points="252,190 372,142 352,162 264,200" fill="#B08D3C" stroke="none"/>
    <ellipse cx="244" cy="236" rx="24" ry="14" transform="rotate(-28 244 236)" fill="#F8F4E8" stroke="none"/>
  </g>
</svg>
